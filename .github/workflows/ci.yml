name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Rebuild state from tracked files and regenerate reports
        run: |
          npm run rebuild
          npm run report
      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: |
            reports/
            docs/maintenance-log.md
            docs/issues/
